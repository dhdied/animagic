services:
  api:
    build: .
    container_name: animagia_api
    # Раскомментить, если работаем только с API
    #ports: 
    #- "8000:8080"
    expose:
      - "8080"
    volumes:
      - .:/app
    command: uvicorn server.main:app --host 0.0.0.0 --port 8080 --reload

  nginx:
    image: nginx:alpine
    container_name: animagia_nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/html/static:ro
      - ./assets:/var/www/html/assets:ro
    depends_on:
      - api