<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <rect width="210" height="297" fill="#ffffff"/>

  <text x="105" y="14" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#333">
    Нарисуй рыбку внутри чёрной рамки
  </text>

  <!-- The frame: this is what the scanner's OpenCV pipeline looks for.
       Keep it bold, closed, and fully inside the paper margins. -->
  <rect x="18" y="24" width="174" height="230" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Faint dashed guide, purely optional for the child, ignored by the algorithm. -->
  <path d="M 55 170
           C 55 130, 90 110, 125 130
           L 150 115
           L 145 140
           L 160 140
           L 145 160
           L 150 185
           L 125 170
           C 90 190, 55 170, 55 170 Z"
        fill="none" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="75" cy="150" r="2.5" fill="#c9c9c9"/>

  <text x="105" y="266" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#777">
    Fish Wall — трафарет A4
  </text>
</svg>
