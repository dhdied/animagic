<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подводная стена — Fish Wall</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  html, body { overflow: hidden; background: var(--deep); }
  #scene3d { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
  #scene { display: block; width: 100vw; height: 100vh; touch-action: none; position: fixed; inset: 0; z-index: 0; }

  .hud {
    position: fixed; top: 18px; left: 22px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: rgba(234,247,247,0.85);
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #E1523F; box-shadow: 0 0 8px currentColor; }
  .dot.online { background: #7EE7B8; }

  .hint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-body); font-weight: 700; font-size: 14px;
    color: rgba(234,247,247,0.65);
    background: rgba(2,22,32,0.45);
    padding: 8px 16px; border-radius: 999px;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .empty-msg {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    pointer-events: none;
    text-align: center;
    padding: 40px;
  }
  .empty-msg h2 { font-family: var(--font-display); font-size: clamp(22px, 4vw, 34px); margin: 0; }
  .empty-msg p { margin: 0; opacity: 0.75; font-size: 16px; }
</style>
</head>
<body>
<canvas id="scene3d"></canvas>
<canvas id="scene"></canvas>
<div class="hud"><span class="dot" id="statusDot"></span><span>Подводная стена</span></div>
<div class="hint" id="hint">🍤 Нажми на воду, чтобы покормить рыбок</div>
<div class="empty-msg" id="emptyMsg">
  <h2>🐟 Пока здесь пусто</h2>
  <p>Открой «Сканер» на телефоне, нарисуй рыбку и отправь её сюда</p>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/static/wall.js"></script>
</body>
</html>
